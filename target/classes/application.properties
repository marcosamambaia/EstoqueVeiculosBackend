# ============================
# Configura��o do Servidor
# ============================
# Define a porta em que o backend Spring Boot vai rodar
server.port=8081


# ============================
# Configura��o do Banco de Dados MySQL
# ============================
# URL de conex�o com o banco de dados MySQL
# - localhost: m�quina local
# - 3306: porta padr�o do MySQL
# - estoque_veiculos: nome do banco de dados (precisa ser criado no MySQL)
# - allowPublicKeyRetrieval=true: permite recuperar chave p�blica (necess�rio em algumas vers�es do MySQL)
# - useSSL=false: desabilita SSL para simplificar a conex�o local
# - serverTimezone=UTC: define fuso hor�rio para evitar erros de timezone
spring.datasource.url=jdbc:mysql://localhost:3306/estoque_veiculos?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC

# Usu�rio do banco de dados
spring.datasource.username=root

# Senha do banco de dados
spring.datasource.password=123456

# Driver JDBC do MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================
# Configura��o do JPA / Hibernate
# ============================
# ddl-auto=update: cria/atualiza tabelas automaticamente conforme as entidades
# (ideal para desenvolvimento; em produ��o pode ser "validate" ou "none")
spring.jpa.hibernate.ddl-auto=update

# show-sql=true: exibe os comandos SQL gerados no console (�til para debug)
spring.jpa.show-sql=true

# Dialeto do Hibernate: define como traduzir comandos para o MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
