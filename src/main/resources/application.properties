# ============================
# Configuração do Servidor
# ============================
# Define a porta em que o backend Spring Boot vai rodar
server.port=8081


# ============================
# Configuração do Banco de Dados MySQL
# ============================
# URL de conexão com o banco de dados MySQL
# - localhost: máquina local
# - 3306: porta padrão do MySQL
# - estoque_veiculos: nome do banco de dados (precisa ser criado no MySQL)
# - allowPublicKeyRetrieval=true: permite recuperar chave pública (necessário em algumas versões do MySQL)
# - useSSL=false: desabilita SSL para simplificar a conexão local
# - serverTimezone=UTC: define fuso horário para evitar erros de timezone
spring.datasource.url=jdbc:mysql://localhost:3306/estoque_veiculos?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC

# Usuário do banco de dados
spring.datasource.username=root

# Senha do banco de dados
spring.datasource.password=123456

# Driver JDBC do MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================
# Configuração do JPA / Hibernate
# ============================
# ddl-auto=update: cria/atualiza tabelas automaticamente conforme as entidades
# (ideal para desenvolvimento; em produção pode ser "validate" ou "none")
spring.jpa.hibernate.ddl-auto=update

# show-sql=true: exibe os comandos SQL gerados no console (útil para debug)
spring.jpa.show-sql=true

# Dialeto do Hibernate: define como traduzir comandos para o MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
